<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>캠페인 리포트 — REVERB JP</title>
<!--
  브랜드 공유 리포트 화면 (자립형). 사양서 docs/specs/2026-09-03-campaign-report-builder.md 「공유 링크 잠금」
  · 로그인 없이 열린다 — 관리자 앱 안에 두면 세션이 없을 때 인플루언서 앱으로 튕긴다(admin-setpw.html 선례)
  · 주소: /report.html?t={토큰}  (P4 확정)
  · 🔴 비밀번호는 서버가 확인한다(verify_report_share_password). 통과 전에는 데이터가 한 줄도 안 온다.
  · 🔴 통과하면 열람 표(ticket)를 sessionStorage 에 둔다 — 탭이 살아 있는 동안만. 비밀번호는 브라우저에 안 남는다.
  · 🔴 가리기는 서버(get_report_share_data)가 한다 — 계정 ID·영수증 주소는 응답에 키 자체가 없다.
  · 표 만들기 코드는 관리자와 같은 원본(js/report-rows.js) — 빌드가 아래 자리에 인라인한다.
  · storage.js 를 안 쓰고 자체 조회를 갖는다(event-scan.html 선례) — 공용 함수를 고쳐도 여기는 안 따라온다.
-->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#18181B;--muted:#6E6E77;--line:#E4E4E7;--bg:#FAFAFA;--primary:#1A1A1A;--pink:#B3261E;--head:#3F3F46}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:13px;color:var(--ink);background:var(--bg)}
  .wrap{margin:0;padding:16px 16px 40px}   /* 전체 폭 — 2026-09-04 사용자 요청. 비밀번호 화면(.gate)만 따로 가운데 */
  .card{background:#fff;border:1px solid var(--line);border-radius:12px}
  .gate{max-width:420px;margin:80px auto;padding:32px 28px;text-align:center}
  .gate h1{font-size:18px;margin:0 0 6px}
  .gate p{color:var(--muted);margin:0 0 18px;line-height:1.7}
  .input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;font-family:inherit;cursor:pointer;color:var(--ink)}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn:disabled{opacity:.5;cursor:default}
  .err{color:var(--pink);font-size:12px;margin-top:10px;min-height:16px}
  .head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .head h1{font-size:18px;margin:0 0 6px}
  .meta{font-size:12px;color:var(--muted);line-height:1.9}
  .meta b{color:var(--ink);font-weight:500}
  /* 좌우 스크롤 막대를 항상 보이게 — 맥은 스크롤 중에만 막대를 그려서 오른쪽에 열이 더 있는지 알 수 없다(2026-09-04 사용자 지적) */
  .tblwrap{overflow-x:scroll}
  .tblwrap::-webkit-scrollbar{height:12px}
  .tblwrap::-webkit-scrollbar-track{background:#f1f1f1;border-radius:6px}
  .tblwrap::-webkit-scrollbar-thumb{background:#b8b8b8;border-radius:6px;border:2px solid #f1f1f1}
  .tblwrap::-webkit-scrollbar-thumb:hover{background:#999}
  /* 표는 내용 너비대로 — 열이 많으면 좌우 스크롤(2026-09-04 사용자 결정). 줄바꿈으로 접히는 것보다 낫다 */
  table{border-collapse:collapse;width:max-content;min-width:100%;table-layout:fixed}
  th{background:var(--head);color:#fff;font-size:12px;font-weight:600;text-align:left;padding:9px 10px;white-space:nowrap;position:sticky;top:0}
  td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.nw{white-space:nowrap}
  td.num{text-align:right;white-space:nowrap}
  a{color:#2563EB}
  .tag{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;background:var(--line);color:var(--muted);font-size:10px}
  .legend{padding:12px 22px;font-size:11px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line)}
  .empty{padding:48px;text-align:center;color:var(--muted)}
  /* 이미지 보기 */
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50}
  .lb.open{display:flex}
  .lb img{max-width:92vw;max-height:84vh;border-radius:8px;background:#222}
  .lb .cap{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;white-space:nowrap}
  .lb .x{position:absolute;top:12px;right:16px;color:#fff;font-size:28px;cursor:pointer;line-height:1}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.9);cursor:pointer;font-size:22px;display:none;align-items:center;justify-content:center}
  .lb .nav.on{display:flex}
  .foot{margin-top:14px;font-size:11px;color:var(--muted);text-align:center}
  @media(max-width:600px){.wrap{padding:12px}.head{padding:14px}.gate{margin:40px auto;padding:24px 18px}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card gate" id="gate">
    <h1>이 리포트는 비밀번호로 보호되어 있습니다</h1>
    <p>REVERB JP 담당자에게 받은 비밀번호를 입력해 주세요.</p>
    <input type="password" class="input" id="pw" placeholder="비밀번호" autocomplete="off">
    <div class="err" id="gateErr"></div>
    <button class="btn btn-primary" id="btnGo" onclick="submitPw()" style="width:100%;justify-content:center;margin-top:6px">확인</button>
  </div>
  <div class="card" id="report" style="display:none"></div>
  <div class="foot">© JFUN · REVERB JP</div>
</div>
<div class="lb" id="lb" onclick="if(event.target===this)closeLb()">
  <span class="cap" id="lbCap"></span><span class="x" onclick="closeLb()">×</span>
  <button class="nav" id="lbPrev" style="left:16px" onclick="lbStep(-1)">‹</button>
  <img id="lbImg" alt="">
  <button class="nav" id="lbNext" style="right:16px" onclick="lbStep(1)">›</button>
</div>

<!-- @@REPORT_ROWS_JS@@ -->

<script>
// ⚠️ supabase.md 「URL/Key 는 SUPABASE_ENVS 에서만」 규칙의 명시적 예외 — 자립형 정적 페이지라
//    dev/lib/supabase.js 를 못 부른다(admin-setpw.html · event-scan.html 선례와 같은 사유).
const SUPABASE_ENVS = {
  production: { url: 'https://nrwtujmlbktxjgdwlpjj.supabase.co', key: 'sb_publishable_3pfK7sF55NZO7owlm13_uA_iCbORAvP' },
  staging:    { url: 'https://qysmxtipobomefudyixw.supabase.co', key: 'sb_publishable_WTxFsvQFllOPIdQ8MDNwCw_e0qBlYTv' }
};
const SUPABASE_ENV = /^(www\.)?globalreverb\.com$/.test(location.hostname) ? 'production' : 'staging';
// 🔴 persistSession:false — 이 화면은 로그인이 없고, 다른 탭의 관리자 세션을 이 화면이 집어 쓰면 안 된다
const db = window.supabase.createClient(SUPABASE_ENVS[SUPABASE_ENV].url, SUPABASE_ENVS[SUPABASE_ENV].key, { auth: { persistSession: false, autoRefreshToken: false } });

const TOKEN = new URLSearchParams(location.search).get('t') || '';
const TICKET_KEY = 'reverb.report.ticket.' + TOKEN;

function esc(s){ if (s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtDT(v){ if(!v) return ''; const d=new Date(v); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function fmtD(v){ if(!v) return ''; const d=new Date(v); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate()); }

// ── 비밀번호 확인 ──
async function submitPw() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('gateErr'); err.textContent = '';
  const btn = document.getElementById('btnGo'); btn.disabled = true;
  try {
    const { data, error } = await db.rpc('verify_report_share_password', { p_token: TOKEN, p_password: pw });
    if (error) throw error;
    if (!data || !data.ok) {
      if (data && data.reason === 'link_expired') return showExpired();
      err.textContent = (data && data.reason === 'locked') ? '잠시 후 다시 시도해 주세요.' : '비밀번호가 맞지 않습니다.';   // 몇 번 남았는지는 알리지 않는다
      return;
    }
    try { sessionStorage.setItem(TICKET_KEY, data.ticket); } catch (e) {}
    document.getElementById('pw').value = '';
    await loadReport(data.ticket);
  } catch (e) { err.textContent = '확인 중 오류가 났습니다. 잠시 후 다시 시도해 주세요.'; }
  finally { btn.disabled = false; }
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') submitPw(); });

function showExpired() {
  document.getElementById('gate').innerHTML = '<h1>링크가 만료되었습니다</h1><p>REVERB JP 담당자에게 새 링크를 요청해 주세요.</p>';
  document.getElementById('report').style.display = 'none';
  document.getElementById('gate').style.display = '';
}

// ── 데이터 → 표 ──
let _rows = [], _title = '', _cols = [];
async function loadReport(ticket) {
  const { data, error } = await db.rpc('get_report_share_data', { p_token: TOKEN, p_ticket: ticket });
  if (error || !data) {
    // 열람 표가 만료·삭제됐거나 링크가 꺼졌다 → 표를 버리고 처음으로. 링크 자체가 죽었는지는 다시 확인해서 가른다.
    try { sessionStorage.removeItem(TICKET_KEY); } catch (e) {}
    const probe = await db.rpc('verify_report_share_password', { p_token: TOKEN, p_password: null });
    if (probe.data && probe.data.reason === 'link_expired') return showExpired();
    document.getElementById('gate').style.display = ''; document.getElementById('report').style.display = 'none';
    document.getElementById('gateErr').textContent = '다시 비밀번호를 입력해 주세요.';
    return;
  }
  // 서버가 준 것: campaigns(스냅샷) · campaign_rows(실물) · deliverables(가려진) · users(가려진) · sources · ext_rows
  const camps = (data.campaigns || []).map(c => ({ id: c.campaign_id, campaign_no: c.campaign_no, title: c.campaign_title, _exists: c.campaign_exists }));
  // 414 부터 서버가 receipt_url 을 모든 종류에 준다(영수증 사진 포함 — 2026-09-04 사용자 결정).
  //   옛 서버(413)가 남아 있으면 리뷰 사진 주소(review_image_url)만 있으므로 그것으로 대신한다.
  const delivs = (data.deliverables || []).map(d => Object.assign({}, d, { receipt_url: d.receipt_url != null ? d.receipt_url : (d.kind === 'review_image' ? d.review_image_url : null) }));
  const users = data.users || {};
  let rows = buildReportRows(delivs, camps, users);
  if (!data.include_audit) rows = rows.filter(r => !(users[r._user_id] && users[r._user_id].is_audit));
  const srcById = {}; (data.sources || []).forEach(s => { srcById[s.id] = s; });
  const ext = (data.ext_rows || []).map(r => _reportExtToRow(Object.assign({ account_id: '' }, r), srcById[r.source_id]));
  rows = rows.concat(ext); rows.forEach((r, i) => { r.no = i + 1; });
  // 계정 ID 는 서버가 안 보낸다 — 열 자체가 비도록 확실히 비운다
  rows.forEach(r => { r.account_id = ''; });
  _rows = rows; _title = data.title || '리포트';
  // 열 — 관리자가 고른 목록. 없으면 「값이 하나도 없는 열은 뺀다」. 계정 ID 는 어떤 설정이어도 뺀다.
  const banned = { account_id: 1 };
  const chosen = Array.isArray(data.columns) ? data.columns : null;
  _cols = REPORT_COLS.filter(c => !banned[c.key]).filter(c => chosen ? chosen.indexOf(c.key) !== -1 : rows.some(r => r[c.key] !== '' && r[c.key] !== null && r[c.key] !== undefined));
  // 「업데이트」 = 리포트를 마지막으로 손본 시각(서버 updated_at — 캠페인 더하기·파일 붙이기 등 구성 변경).
  //   2026-09-04 사용자 결정: 조회 시각·포인테일 파일 시각을 따로 적지 않고 이 하나만 보인다.
  const updatedAt = data.updated_at || null;
  const buyN = rows.filter(r => r.receipt_uploaded_at).length, revN = rows.filter(r => r.ch_qoo10_url || r.ch_cosme_url).length;

  const el = document.getElementById('report');
  el.innerHTML = `
    <div class="head">
      <div><h1>${esc(_title)}</h1>
        <div class="meta"><b>업데이트</b> ${updatedAt ? esc(fmtDT(updatedAt)) : '—'}<span style="margin:0 10px;color:var(--line)">|</span><b>요약</b> 인원 ${rows.length}명 · 구매 ${buyN} · 리뷰 ${revN}</div></div>
      <div><button class="btn" onclick="downloadExcel()"><span class="material-icons-round" translate="no" style="font-size:16px">download</span> 엑셀 내려받기</button></div>
    </div>
    <div class="tblwrap"><table><colgroup>${_cols.map(c => '<col style="width:' + esc(c.w) + '">').join('')}</colgroup><thead><tr>${_cols.map(c => '<th>' + esc(c.label) + '</th>').join('')}</tr></thead>
      <tbody>${rows.length ? rows.map(rowHtml).join('') : '<tr><td colspan="' + _cols.length + '" class="empty">아직 제출된 결과물이 없습니다.</td></tr>'}</tbody></table></div>
    <div class="legend">이름은 일부만 표시됩니다. 계정 정보(이메일)는 개인정보 보호를 위해 제공하지 않습니다.${ext.length ? ' 포인테일(스토어링크) 참가자 정보는 해당 서비스의 결과 파일을 그대로 옮긴 것입니다.' : ''}</div>`;
  document.getElementById('gate').style.display = 'none'; el.style.display = '';
}

function chanCell(url, kind, who) {
  if (!url) return '';
  const list = String(url).split(/\r?\n/).map(u => u.trim()).filter(Boolean);
  const tag = kind === 'photo' ? '<span class="tag">사진</span>' : (kind === 'post' ? '<span class="tag">게시물</span>' : '');
  if (kind === 'post') return `<a href="${esc(list[0])}" target="_blank" rel="noopener">열기 ↗</a>${tag}`;
  const js = esc(JSON.stringify(list));
  if (list.length > 1) return list.map((u, i) => `<a href="javascript:void(0)" onclick='openLb(${js},${i},"${esc(who)}")'>사진 ${i + 1}</a>`).join(' · ');
  return `<a href="javascript:void(0)" onclick='openLb(${js},0,"${esc(who)}")'>열기</a>${tag}`;
}
function rowHtml(r) {
  const who = r.order_no ? '주문번호 ' + r.order_no : (r.name_kanji || 'No.' + r.no);
  return '<tr>' + _cols.map(c => {
    const v = r[c.key];
    if (c.key === 'receipt_url') return '<td class="nw">' + chanCell(r.receipt_url, 'photo', who + ' · 영수증') + '</td>';
    if (c.key === 'ch_qoo10_url') return '<td class="nw">' + chanCell(r.ch_qoo10_url, r.ch_qoo10_kind, who + ' · 큐텐 결과물') + '</td>';
    if (c.key === 'ch_cosme_url') return '<td class="nw">' + chanCell(r.ch_cosme_url, r.ch_cosme_kind, who + ' · 엣코스메 결과물') + '</td>';
    if (c.key === 'amount') return '<td class="num">' + (v === '' || v === null || v === undefined ? '' : '¥' + Number(v).toLocaleString('ja-JP')) + '</td>';
    if (/_at$/.test(c.key)) return '<td class="nw" style="font-size:11px">' + esc(fmtDT(v)) + '</td>';
    const t = v === null || v === undefined ? '' : String(v);
    return '<td class="nw"' + (c.wrap ? ' title="' + esc(t) + '"' : '') + '>' + esc(t) + '</td>';
  }).join('') + '</tr>';
}

// ── 이미지 보기 (여러 장이면 화살표) ──
let _lb = null;
function openLb(urls, i, base) { _lb = { urls, i, base }; showLb(); document.getElementById('lb').classList.add('open'); }
function showLb() { const g = _lb; document.getElementById('lbImg').src = g.urls[g.i]; document.getElementById('lbCap').textContent = g.base + ' 사진 ' + (g.i + 1) + '/' + g.urls.length; const m = g.urls.length > 1; document.getElementById('lbPrev').classList.toggle('on', m); document.getElementById('lbNext').classList.toggle('on', m); }
function lbStep(d) { if (!_lb || _lb.urls.length < 2) return; _lb.i = (_lb.i + d + _lb.urls.length) % _lb.urls.length; showLb(); }
function closeLb() { document.getElementById('lb').classList.remove('open'); document.getElementById('lbImg').src = ''; _lb = null; }
document.addEventListener('keydown', e => { if (!_lb) return; if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') lbStep(-1); if (e.key === 'ArrowRight') lbStep(1); });

// ── 엑셀 (가린 판) — 🔴 화면과 같은 열·같은 값. 링크를 꺼도 파일은 살아 있으므로 화면보다 더 보여주면 안 된다.
let _xl = null;
function loadExcelJS() { if (window.ExcelJS) return Promise.resolve(); return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'; s.onload = res; s.onerror = () => rej(new Error('ExcelJS 로드 실패')); document.head.appendChild(s); }); }
async function downloadExcel() {
  try {
    await loadExcelJS();
    const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('리포트');
    ws.columns = _cols.map(c => ({ header: c.label, key: c.key, width: Math.max(10, Math.round(parseInt(c.w, 10) / 8)) }));
    ws.getRow(1).font = { bold: true };
    _rows.forEach(r => { const o = {}; _cols.forEach(c => { o[c.key] = c.key === 'amount' ? ((r.amount === '' || r.amount == null) ? '' : Number(r.amount)) : (r[c.key] == null ? '' : r[c.key]); }); ws.addRow(o); });
    const buf = await wb.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const a = document.createElement('a'); a.href = url;
    const t = new Date(); const ymd = t.getFullYear() + String(t.getMonth() + 1).padStart(2, '0') + String(t.getDate()).padStart(2, '0');
    a.download = _title.replace(/[\\/:*?"<>|]/g, '') + '_' + ymd + '.xlsx';   // ⚠️ 관리자용과 달리 「_관리자용」이 없다
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  } catch (e) { alert('엑셀을 만들지 못했습니다 — ' + (e && e.message || e)); }
}

// ── 시작: 토큰 없으면 만료 화면. 열람 표가 남아 있으면 바로 시도(실패하면 비밀번호 화면).
(async function () {
  if (!TOKEN) return showExpired();
  let t = null; try { t = sessionStorage.getItem(TICKET_KEY); } catch (e) {}
  if (t) await loadReport(t);
  else { const probe = await db.rpc('verify_report_share_password', { p_token: TOKEN, p_password: null }); if (probe.data && probe.data.reason === 'link_expired') showExpired(); }
})();
</script>
