<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>REVERB JP · 메일 원본 보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope','Pretendard Variable',Pretendard,'Noto Sans JP',sans-serif; background:#EEECE6; color:#161618; padding:40px 20px 80px; min-height:100vh; }
  .head { max-width:760px; margin:0 auto 22px; }
  .back-link { display:inline-block; font-size:12px; color:#666; text-decoration:none; margin-bottom:14px; letter-spacing:0.04em; }
  .back-link:hover { color:#161618; }
  h1 { font-size:22px; font-weight:800; letter-spacing:-0.02em; margin-bottom:6px; word-break:break-all; }
  .sub { font-size:13px; color:#666; line-height:1.6; }
  .sub a { color:#161618; }
  .note { max-width:760px; margin:0 auto 12px; padding:10px 14px; background:#FFF6E5; border:1px solid #F0D6A0; border-radius:8px; font-size:11px; color:#8A6A2A; line-height:1.6; }
  .note code { font-family:monospace; background:#fff; padding:1px 5px; border-radius:4px; }
  .frame { max-width:760px; margin:0 auto; background:#fff; border-radius:14px; box-shadow:0 4px 20px rgba(0,0,0,0.06); overflow:hidden; }
  .frame iframe { width:100%; min-height:600px; border:0; display:block; }
  .error { max-width:760px; margin:0 auto; padding:18px; background:#fff; border-radius:14px; font-size:13px; color:#A02038; }
</style>
</head>
<body>

<div class="head">
  <a href="index.html" class="back-link">← 메일 목록</a>
  <h1 id="title">메일 원본</h1>
  <p class="sub">발송에 실제로 쓰이는 파일을 그대로 보여 줍니다. 변수 자리는 <code>{{…}}</code> 그대로이고, 일부 파일은 메일 조각(행·섹션)이라 완성된 화면이 아닙니다. <a id="raw" href="#" target="_blank" rel="noopener">파일 그대로 새 창에서 열기 ↗</a></p>
</div>

<p class="note">⚠️ 이 파일은 <b>발송 원본</b>입니다. 고치면 <code>scripts/sync-email-templates.sh</code> 로 서버 함수의 복사본에 동기화해야 실제 메일이 바뀝니다.</p>

<div class="frame" id="frame"><iframe id="src" title="메일 원본"></iframe></div>

<script>
(function() {
  // 카탈로그 「원본」 버튼은 ?f=파일이름.html 로 들어온다. 같은 폴더의 .html 만 허용(경로·바깥 주소 차단)
  var f = new URLSearchParams(location.search).get('f') || '';
  var ok = /^[a-z0-9][a-z0-9.-]*\.html$/.test(f) && f !== 'index.html' && f !== 'source.html';
  var frame = document.getElementById('frame');
  if (!ok) {
    frame.outerHTML = '<div class="error">열 수 없는 파일 이름입니다. 메일 목록에서 「원본」 버튼으로 다시 들어와 주세요.</div>';
    return;
  }
  document.title = 'REVERB JP · 원본 · ' + f;
  document.getElementById('title').textContent = f;
  document.getElementById('raw').href = f;
  var iframe = document.getElementById('src');
  iframe.addEventListener('load', function() {
    try { // 같은 출처라 안쪽 높이를 읽어 스크롤 없이 전부 보이게
      var h = iframe.contentDocument.documentElement.scrollHeight;
      if (h > 0) iframe.style.height = (h + 24) + 'px';
    } catch (e) {}
  });
  iframe.src = f;
})();
</script>

</body>
</html>
