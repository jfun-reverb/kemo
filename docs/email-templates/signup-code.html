<!DOCTYPE html>
<!--
  Mail: 회원가입 이메일 인증번호 (인플루언서 가입 희망자용)
  Trigger: signup-code-send Edge Function (가입 화면의 「認証コードを送る」 — 비로그인 호출)
  To:      가입하려는 이메일 주소 (그 사람이 입력한 주소)
  Lang:    JA

  Placeholders:
    {{code}}      6자리 숫자 (함수가 숫자만 넣는다 — 이스케이프 불필요하나 함수가 한 번 더 숫자 검사)
    {{minutes}}   유효 시간(분, 숫자) — code_expires_at 에서 계산
    {{site_url}}  사이트 루트 URL
    {{help_line_url}} LINE 문의 URL

  ── 한국어 뜻(담당자 전달용, 화면에는 노출되지 않음) ──────────────────
    제목: "[REVERB JP] 인증 코드 안내"
    헤더: "인증 코드 안내"
    본문: "REVERB JP에 회원가입해 주셔서 감사합니다. 아래 숫자 6자리를 가입 화면에 입력해 주세요.
          [큰 숫자] 인증 코드
          이 코드는 {{minutes}}분 동안 유효합니다.
          이 메일에 짚이는 데가 없으면 아무것도 하지 말고 이 메일을 삭제해 주세요."
    푸터(4줄, 전 템플릿 공통 문구)
  ──────────────────────────────────────────────────────────────────
-->
<div style="font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Manrope',Arial,sans-serif;color:#222;max-width:600px">

  <!-- 헤더 -->
  <div style="background:#E8344E;border-radius:12px 12px 0 0;padding:28px 32px 24px">
    <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.75);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:6px">REVERB JP</div>
    <div style="font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.02em;line-height:1.3">認証コードのお知らせ</div>
  </div>

  <!-- 본문 -->
  <div style="background:#fff;border:1px solid #EAEAE4;border-top:none;border-radius:0 0 12px 12px;padding:28px 32px 24px">

    <p style="margin:0 0 20px;font-size:14px;color:#444;line-height:1.7">
    REVERB JP にご登録いただきありがとうございます。<br>
    下の6けたの数字を、登録画面に入力してください。</p>

    <!-- 코드 박스 -->
    <div style="background:#F7F4EE;border:1px solid #EAEAE4;border-radius:10px;padding:20px 18px;margin-bottom:22px;text-align:center">
      <div style="color:#888;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;margin-bottom:8px">認証コード</div>
      <div style="font-weight:800;font-size:34px;color:#161618;letter-spacing:0.3em;padding-left:0.3em">{{code}}</div>
    </div>

    <p style="margin:0 0 14px;font-size:14px;color:#444;line-height:1.7">
      このコードは <b>{{minutes}}分間</b> 有効です。
    </p>

    <p style="margin:0;font-size:12px;color:#888;line-height:1.7">
      このメールに心当たりがない場合は、何もせずこのメールを削除してください。
    </p>

  </div>

  <!-- 푸터 (통일) -->
  <p style="margin:24px 0 0;color:#999;font-size:11px;line-height:1.6">
    REVERB JP のメンバーシップに紐づいて自動送信されています。<br>
    お問い合わせは LINE <a href="{{help_line_url}}" style="color:#999;text-decoration:underline">@reverb.jp</a> までお願いいたします。<br>
    <br>
    © JFUN Corp. · 株式会社ジェイファン<br>
    <a href="{{site_url}}" style="color:#999;text-decoration:underline">{{site_url}}</a>
  </p>

</div>
